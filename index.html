<style>
:root {
  --cream: #F3ECDF;
  --paper: #FBF7EF;
  --sand: #E7DCC8;
  --ink: #0D0C0A;
  --ink-2: #181611;
  --ink-3: #24211A;
  --gold: #B88A3E;
  --gold-hi: #D9B36A;
  --gold-lo: #8A6526;
  --mute: rgba(13, 12, 10, .64);
  --faint: rgba(13, 12, 10, .42);
  --hair: rgba(184, 138, 62, .42);
  --hair-soft: rgba(184, 138, 62, .2);
  --on-dark: #F3ECDF;
  --on-dark-mute: rgba(243, 236, 223, .62);
  --d-bg: #121110;
  --d-ink: #F1E7D6;
  --d-acc: #C9A24A;
  --gut: 16px;
  --beat: .476s;
  --ease: cubic-bezier(.22, .8, .2, 1);
  --disp: 'Bodoni Moda', 'Didot', 'Times New Roman', serif;
  --sans: 'Manrope', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --fa: 'Vazirmatn', system-ui, sans-serif;
}
* { box-sizing: border-box; }
html { background: var(--cream); -webkit-text-size-adjust: 100%; }
html.anim { scroll-behavior: smooth; }
body {
  margin: 0; background: var(--cream); color: var(--ink);
  font-family: var(--sans); font-size: 16px; line-height: 1.6;
  overflow-x: hidden; overflow-x: clip; -webkit-font-smoothing: antialiased;
}
html[lang="fa"] body { font-family: var(--fa); line-height: 1.85; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
img { display: block; max-width: 100%; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 1.5px solid var(--gold); outline-offset: 3px; border-radius: 6px; }
.wrap { max-width: 1160px; margin: 0 auto; padding: 0 var(--gut); }
.disp { font-family: var(--disp); font-weight: 500; letter-spacing: -.012em; font-optical-sizing: auto; }
html[lang="fa"] .disp { font-family: var(--fa); font-weight: 700; letter-spacing: 0; }
.lat { font-family: var(--sans); direction: ltr; unicode-bidi: isolate; }

/* split words (headings appear word by word, half a beat apart) */
.w { display: inline-block; overflow: hidden; vertical-align: top; padding-bottom: .1em; margin-bottom: -.1em; }
.w > span { display: inline-block; }
html.anim .split .w > span { transform: translateY(108%); }
html.anim .split.in .w > span { transform: none; transition: transform .8s var(--ease) calc(var(--i) * .238s); }

html.anim [data-rv] { opacity: 0; transform: translateY(18px); }
html.anim [data-rv].in { opacity: 1; transform: none; transition: opacity .8s ease, transform .9s var(--ease); transition-delay: calc(var(--d, 0) * .238s); }

/* ---------- nav ---------- */
nav.top {
  position: fixed; inset-inline: 0; top: 0; z-index: 40;
  padding: calc(10px + env(safe-area-inset-top)) 0 10px;
  background: linear-gradient(180deg, rgba(243,236,223,.94), rgba(243,236,223,.78) 70%, rgba(243,236,223,0));
  -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
}
nav.top .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.logo { display: inline-flex; align-items: center; gap: 9px; }
.logo svg { width: 28px; height: 28px; display: block; }
.logo b { font-family: var(--disp); font-weight: 600; font-size: 22px; letter-spacing: .01em; direction: ltr; }
.nav-r { display: flex; align-items: center; gap: 12px; }
.nav-links { display: none; gap: 22px; font-size: 14px; color: var(--mute); }
.nav-links a:hover { color: var(--ink); }
.lang { display: inline-flex; border: 1px solid var(--hair); border-radius: 999px; padding: 2px; direction: ltr; }
.lang button { font-size: 12px; font-weight: 600; letter-spacing: .04em; padding: 4px 9px; border-radius: 999px; color: var(--mute); line-height: 1.2; }
.lang button[aria-pressed="true"] { background: var(--ink); color: var(--gold-hi); }
.lang button.fa { font-family: var(--fa); }
@media (min-width: 900px) { .nav-links { display: flex; } }

/* ---------- buttons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 9px; min-height: 48px; padding: 0 22px; border-radius: 999px; font-weight: 600; font-size: 15px; transition: transform .3s var(--ease), box-shadow .3s ease, background .3s ease; }
.btn svg { width: 18px; height: 18px; }
.btn-dark { background: var(--ink); color: var(--cream); box-shadow: 0 10px 30px -12px rgba(13,12,10,.6); }
.btn-dark svg { color: var(--gold-hi); }
.btn-dark:hover { transform: translateY(-2px); box-shadow: 0 16px 36px -14px rgba(13,12,10,.7); }
.btn-line { border: 1px solid var(--gold); color: var(--ink); }
.btn-line:hover { background: rgba(184,138,62,.1); }

/* ---------- section heads ---------- */
section { position: relative; }
.sec { padding: 96px 0; }
.kick { display: flex; align-items: center; gap: 12px; font-size: 12px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: var(--gold-lo); }
html[lang="fa"] .kick { letter-spacing: 0; font-size: 14px; font-weight: 600; text-transform: none; }
.kick .n { font-family: var(--disp); font-size: 15px; letter-spacing: 0; color: var(--gold); }
.kick::after { content: ''; flex: 0 0 48px; height: 1px; background: var(--hair); }
h2.disp { font-size: clamp(34px, 8vw, 60px); line-height: 1.05; margin: 16px 0 0; }
html[lang="fa"] h2.disp { line-height: 1.35; font-size: clamp(30px, 7vw, 50px); }
.lede { color: var(--mute); max-width: 560px; margin: 16px 0 0; font-size: 17px; }

/* ---------- hero ---------- */
#hero { padding: calc(92px + env(safe-area-inset-top)) 0 72px; overflow: hidden; }
#hero::before { content: ''; position: absolute; inset: -10% -30% auto auto; width: 90vmax; height: 90vmax; background: radial-gradient(closest-side, rgba(217,179,106,.28), rgba(217,179,106,0)); pointer-events: none; }
.hero-grid { display: grid; gap: 44px; align-items: center; position: relative; }
@media (min-width: 960px) { .hero-grid { grid-template-columns: 1fr 430px; gap: 64px; } }
.eyebrow { display: inline-flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 600; color: var(--gold-lo); border: 1px solid var(--hair); border-radius: 999px; padding: 5px 14px 5px 10px; }
.eyebrow i { width: 7px; height: 7px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 0 4px rgba(184,138,62,.16); }
h1.disp { font-size: clamp(46px, 12.5vw, 92px); line-height: .98; margin: 20px 0 0; }
html[lang="fa"] h1.disp { font-size: clamp(38px, 10vw, 70px); line-height: 1.3; }
h1 em { font-style: italic; color: var(--gold); }
.hero-sub { font-size: clamp(17px, 4.4vw, 19px); color: var(--mute); max-width: 520px; margin: 20px 0 0; }
.ctas { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 28px; }
.note { margin-top: 16px; font-size: 13px; color: var(--faint); }

/* ---------- chat (hero demo) ---------- */
.chat-wrap { position: relative; justify-self: center; width: 100%; max-width: 430px; }
.chat-wrap::after { content: ''; position: absolute; inset: 12% 8% -4%; background: radial-gradient(closest-side, rgba(184,138,62,.45), rgba(184,138,62,0)); filter: blur(30px); z-index: -1; opacity: var(--glow, .5); transition: opacity .2s; }
.chat { position: relative; height: 652px; border-radius: 30px; background: var(--ink); color: var(--on-dark); border: 1px solid rgba(217,179,106,.28); box-shadow: 0 40px 80px -40px rgba(13,12,10,.75), inset 0 1px 0 rgba(255,255,255,.06); display: flex; flex-direction: column; overflow: hidden; }
.chat::before { content: ''; position: absolute; top: -40%; bottom: -40%; width: 38%; left: 0; background: linear-gradient(90deg, rgba(217,179,106,0), rgba(217,179,106,.07), rgba(217,179,106,0)); transform: translateX(var(--beam, -120%)) rotate(18deg); pointer-events: none; z-index: 3; }
.chat-head { display: flex; align-items: center; gap: 11px; padding: 14px 14px 12px; border-bottom: 1px solid rgba(217,179,106,.14); }
.av { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: #1d1a14; border: 1px solid rgba(217,179,106,.35); }
.av svg { width: 20px; height: 20px; }
.chat-head .who { flex: 1; min-width: 0; line-height: 1.25; }
.chat-head .who b { font-family: var(--disp); font-size: 17px; font-weight: 600; direction: ltr; unicode-bidi: isolate; }
.chat-head .who small { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--on-dark-mute); }
.chat-head .who small i { width: 6px; height: 6px; border-radius: 50%; background: #7fbf8a; }
.snd { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; color: var(--gold-hi); border: 1px solid rgba(217,179,106,.4); border-radius: 999px; padding: 6px 11px; }
.snd svg { width: 16px; height: 16px; }
.snd .on-i { display: none; }
.snd[aria-pressed="true"] { background: rgba(217,179,106,.16); }
.snd[aria-pressed="true"] .on-i { display: block; }
.snd[aria-pressed="true"] .off-i { display: none; }
html.anim .snd[aria-pressed="false"] { animation: invite 2.86s ease-in-out infinite; }
@keyframes invite { 0%, 100% { box-shadow: 0 0 0 0 rgba(217,179,106,0); } 50% { box-shadow: 0 0 0 5px rgba(217,179,106,.14); } }
.chat-body { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: flex-end; gap: 9px; padding: 14px 12px 10px; overflow: hidden; -webkit-mask-image: linear-gradient(180deg, transparent 0, #000 46px); mask-image: linear-gradient(180deg, transparent 0, #000 46px); }
.row { flex: 0 0 auto; overflow: hidden; display: none; }
.row.show { display: block; }
.msg { max-width: 86%; width: fit-content; border-radius: 18px; padding: 9px 13px; font-size: 14px; line-height: 1.5; }
.me { margin-inline-start: auto; background: #2B261D; border-end-end-radius: 6px; }
.bot { background: #16140F; border: 1px solid rgba(217,179,106,.2); border-end-start-radius: 6px; }
.msg p { margin: 0; }
.clips { display: flex; gap: 7px; padding: 7px; }
.clip { position: relative; width: 62px; height: 96px; border-radius: 9px; overflow: hidden; transform: rotate(var(--r)); box-shadow: 0 6px 14px -6px rgba(0,0,0,.8); }
.clip img { width: 100%; height: 100%; object-fit: cover; filter: saturate(.85) contrast(.92) brightness(1.04); }
.clip span { position: absolute; inset: auto 5px 4px auto; font-size: 10px; font-weight: 600; color: #fff; text-shadow: 0 1px 2px #000; direction: ltr; }
.clip::before { content: ''; position: absolute; left: 6px; top: 6px; border-left: 7px solid #fff; border-top: 5px solid transparent; border-bottom: 5px solid transparent; opacity: .9; z-index: 1; filter: drop-shadow(0 1px 1px #000); }
.typing { display: flex; gap: 5px; padding: 13px 15px; }
.typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--gold-hi); opacity: .45; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.chip { font-size: 11.5px; font-weight: 600; border: 1px solid rgba(217,179,106,.45); color: var(--gold-hi); border-radius: 999px; padding: 3px 9px; white-space: nowrap; }
.reelmsg { width: 100%; max-width: 100%; display: flex; flex-direction: column; align-items: center; gap: 9px; padding: 14px 10px 12px; }

/* the gold gallery frame: our signature */
.gframe { position: relative; padding: 6px; }
.gframe .edges { position: absolute; inset: 0; pointer-events: none; }
.edges { display: block; }
.eg { position: absolute; background: var(--gold-hi); }
.eg.t { left: 0; right: 0; top: 0; height: 1.5px; transform-origin: 0 50%; }
.eg.r { top: 0; bottom: 0; right: 0; width: 1.5px; transform-origin: 50% 0; }
.eg.b { left: 0; right: 0; bottom: 0; height: 1.5px; transform-origin: 100% 50%; }
.eg.l { top: 0; bottom: 0; left: 0; width: 1.5px; transform-origin: 50% 100%; }
.undrawn .eg.t, .undrawn .eg.b { transform: scaleX(0); }
.undrawn .eg.r, .undrawn .eg.l { transform: scaleY(0); }
.cn { position: absolute; width: 7px; height: 7px; border: 1px solid var(--gold-hi); background: var(--ink); transform: rotate(45deg); }
.cn.tl { left: -3px; top: -3px; } .cn.tr { right: -3px; top: -3px; } .cn.br { right: -3px; bottom: -3px; } .cn.bl { left: -3px; bottom: -3px; }
.phone { position: relative; width: min(44vw, 172px); aspect-ratio: 9 / 16; border-radius: 6px; overflow: hidden; background: #050505; direction: ltr; }
.shot { position: absolute; inset: 0; opacity: 0; overflow: hidden; }
.shot img { position: absolute; left: 0; bottom: 0; width: 100%; height: 128%; object-fit: cover; object-position: center bottom; filter: contrast(1.07) saturate(1.06) sepia(.06); will-change: transform; }
.shot.rev img { position: absolute; left: 0; bottom: 0; height: 128%; object-position: center bottom; }
.brandtag { position: absolute; top: 8px; left: 0; right: 0; text-align: center; font-size: 7px; letter-spacing: .3em; font-weight: 700; color: var(--d-acc); text-transform: uppercase; opacity: .9; z-index: 2; }
.ovq { position: absolute; left: 50%; top: 30%; transform: translateX(-50%); white-space: nowrap; font-size: 11px; font-weight: 700; color: #fff; background: rgba(10,9,7,.72); border: 1px solid var(--d-acc); border-radius: 999px; padding: 4px 10px; opacity: 0; z-index: 2; unicode-bidi: plaintext; }
.ovl { position: absolute; left: 10px; top: 24px; font-size: 7.5px; letter-spacing: .22em; color: #fff; opacity: 0; z-index: 2; text-shadow: 0 1px 4px rgba(0,0,0,.6); }
.ovl i { display: block; width: 18px; height: 1px; background: var(--d-acc); margin-bottom: 5px; }
.flash { position: absolute; inset: 0; background: radial-gradient(circle at 50% 55%, rgba(255,236,190,.95), rgba(217,179,106,.6) 40%, rgba(217,179,106,0) 75%); opacity: 0; z-index: 4; mix-blend-mode: screen; }
.endcard { position: absolute; inset: 0; z-index: 3; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 5px; padding: 0 10px 26%; text-align: center; background: linear-gradient(180deg, rgba(0,0,0,0) 20%, var(--d-bg) 68%); color: var(--d-ink); opacity: 0; }
.endcard > * { unicode-bidi: plaintext; }
.dlogo { width: 64px; height: 38px; border-radius: 6px; overflow: hidden; display: grid; place-items: center; }
.dlogo svg, .dlogo img { width: 100%; height: 100%; object-fit: contain; display: block; }
.endcard b { font-family: var(--disp); font-size: 14px; font-weight: 600; line-height: 1.15; }
.endcard .ln, .ecm .ln { width: 22px; height: 1px; background: var(--d-acc); }
.endcard span { font-size: 9.5px; font-weight: 700; color: var(--d-acc); }
.endcard small { font-size: 8.5px; opacity: .8; direction: ltr; }
.meter { width: 100%; max-width: 250px; display: grid; gap: 5px; }
.wave { height: 22px; display: flex; align-items: center; gap: 2px; transform-origin: center; }
.wave i { flex: 1; height: calc(var(--h) * 100%); border-radius: 2px; background: rgba(243,236,223,.18); transition: background .15s; }
.wave i.on { background: var(--gold-hi); }
.grid { position: relative; height: 18px; }
.grid .tk { position: absolute; bottom: 0; width: 1px; height: 5px; background: rgba(217,179,106,.45); }
.grid .tk.bar { height: 10px; background: rgba(217,179,106,.75); }
.grid .tk.drop { height: 14px; width: 2px; background: var(--gold-hi); }
.grid .base { position: absolute; left: 0; right: 0; bottom: 0; height: 1px; background: rgba(217,179,106,.35); }
.grid .dot { position: absolute; bottom: -3px; width: 7px; height: 7px; margin-left: -3.5px; border-radius: 50%; background: #FFE6AE; box-shadow: 0 0 10px 2px rgba(255,214,140,.7); left: 3.125%; }
.qa { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 12px; font-size: 12px; color: var(--on-dark-mute); min-height: 18px; }
.q { display: inline-flex; align-items: center; gap: 5px; }
.q svg { width: 14px; height: 14px; color: var(--gold-hi); }
.acts { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
.acts button { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; border-radius: 999px; padding: 7px 12px; border: 1px solid rgba(217,179,106,.45); color: var(--on-dark); position: relative; }
.acts button small { font-size: 10px; font-weight: 600; color: var(--gold-hi); opacity: .85; }
.acts .b-ok { background: var(--gold-hi); color: var(--ink); border-color: var(--gold-hi); }
.acts .b-ok.pressed { box-shadow: 0 0 0 6px rgba(217,179,106,.22); }
.chat-in { display: flex; align-items: center; gap: 8px; margin: 0 12px 12px; padding: 6px 6px 6px 12px; border: 1px solid rgba(217,179,106,.22); border-radius: 999px; }
html[dir="rtl"] .chat-in { padding: 6px 12px 6px 6px; }
.chat-in .ic { width: 20px; height: 20px; color: var(--on-dark-mute); flex: none; }
.field { flex: 1; min-width: 0; font-size: 14px; white-space: nowrap; overflow: hidden; }
.field .ph { color: rgba(243,236,223,.35); }
.field.typing-now .ph { display: none; }
.field .caret { display: none; width: 1px; height: 15px; background: var(--gold-hi); vertical-align: -2px; margin-inline-start: 1px; }
.field.typing-now .caret { display: inline-block; }
.send { width: 34px; height: 34px; border-radius: 50%; background: var(--gold-hi); color: var(--ink); display: grid; place-items: center; flex: none; }
.send svg { width: 16px; height: 16px; }
html[dir="rtl"] .send svg { transform: scaleX(-1); }
.hint { position: absolute; top: -30px; inset-inline-end: 8px; font-size: 12px; color: var(--gold-lo); display: flex; align-items: center; gap: 6px; }
.hint::after { content: ''; width: 18px; height: 1px; background: var(--gold); }
.hint.gone { opacity: 0; transition: opacity .6s; }

/* ---------- how it works ---------- */
.steps { position: relative; display: grid; gap: 40px; margin-top: 56px; padding-inline-start: 40px; }
.rail { position: absolute; inset-inline-start: 11px; top: 6px; bottom: 6px; width: 1px; background: var(--hair-soft); }
.rail .fill { position: absolute; inset: 0; background: var(--gold); transform-origin: top; transform: scaleY(var(--p, 0)); }
.rail .tk { position: absolute; inset-inline-start: -6px; width: 13px; height: 1px; background: var(--gold); top: var(--at); }
.rail .dot { position: absolute; inset-inline-start: -5px; width: 11px; height: 11px; margin-top: -5px; border-radius: 50%; background: var(--paper); border: 1.5px solid var(--gold); top: var(--dot, 0); }
.rail .dot.lit { background: var(--gold-hi); box-shadow: 0 0 0 5px rgba(217,179,106,.2); }
@media (min-width: 900px) {
  .steps { grid-template-columns: repeat(3, 1fr); gap: 28px; padding-inline-start: 0; padding-top: 44px; }
  .rail { inset-inline: 0; top: 8px; bottom: auto; width: auto; height: 1px; }
  .rail .fill { transform-origin: left; transform: scaleX(var(--p, 0)); }
  html[dir="rtl"] .rail .fill { transform-origin: right; }
  .rail .tk { top: -6px; width: 1px; height: 13px; inset-inline-start: var(--at); }
  .rail .dot { top: -5px; margin-top: 0; inset-inline-start: var(--dot, 0); margin-inline-start: -5px; }
}
.step { position: relative; }
.step .no { font-family: var(--disp); font-size: 15px; color: var(--gold); }
.step h3 { font-family: var(--disp); font-weight: 500; font-size: 30px; line-height: 1.1; margin: 4px 0 8px; }
html[lang="fa"] .step h3 { font-family: var(--fa); font-weight: 700; font-size: 24px; line-height: 1.5; }
.step p { margin: 0; color: var(--mute); }
.ill { margin-top: 18px; background: var(--ink); color: var(--on-dark); border-radius: 20px; padding: 14px; min-height: 154px; display: flex; flex-direction: column; gap: 8px; justify-content: center; border: 1px solid rgba(217,179,106,.25); }
.ill .msg { font-size: 13px; }
.ill .mini-clips { display: flex; gap: 6px; }
.ill .mini-clips img { width: 40px; height: 62px; object-fit: cover; border-radius: 6px; }
.voice { display: flex; align-items: center; gap: 8px; }
.voice .pl { width: 22px; height: 22px; border-radius: 50%; background: var(--gold-hi); display: grid; place-items: center; }

.mini-reel b svg { width: 16px; height: 16px; }
html.anim .step .ill > * { opacity: 0; transform: translateY(10px); }
html.anim .step.on .ill > * { opacity: 1; transform: none; transition: opacity .5s ease, transform .6s var(--ease); }
html.anim .step.on .ill > *:nth-child(2) { transition-delay: .238s; }
html.anim .step.on .ill > *:nth-child(3) { transition-delay: .476s; }
html.anim .step.on .ill > *:nth-child(4) { transition-delay: .714s; }
html.anim .step .eg.t, html.anim .step .eg.b { transform: scaleX(0); }
html.anim .step .eg.r, html.anim .step .eg.l { transform: scaleY(0); }
html.anim .step.on .eg { transform: none; transition: transform .238s linear; }
html.anim .step.on .eg:nth-child(1) { transition-delay: .46s; }
html.anim .step.on .eg:nth-child(2) { transition-delay: .7s; }
html.anim .step.on .eg:nth-child(3) { transition-delay: .94s; }
html.anim .step.on .eg:nth-child(4) { transition-delay: 1.18s; }
html.anim .step h3, html.anim .step p, html.anim .step .no { opacity: .28; transition: opacity .6s ease; }
html.anim .step.on h3, html.anim .step.on p, html.anim .step.on .no { opacity: 1; }

/* ---------- before / after ---------- */

.ba-after .bline i.bar { height: 8px; }
.ba-after .edges { position: absolute; inset: 10px; }
.ba-before { position: absolute; inset: 0; clip-path: inset(0 calc(100% - var(--x)) 0 0); }
.ba-before img { transform: rotate(-1.6deg) scale(1.08); filter: saturate(.78) contrast(.9) brightness(1.05) blur(.3px); }
.cam { position: absolute; inset: 0; color: #fff; font-size: 11px; font-weight: 600; text-shadow: 0 1px 2px rgba(0,0,0,.7); }
.cam .rec { position: absolute; left: 14px; top: 14px; display: flex; align-items: center; gap: 6px; }

.thirds { position: absolute; inset: 0; background:
  linear-gradient(90deg, transparent calc(33.33% - .5px), rgba(255,255,255,.28) 0 calc(33.33% + .5px), transparent 0 calc(66.66% - .5px), rgba(255,255,255,.28) 0 calc(66.66% + .5px), transparent 0),
  linear-gradient(180deg, transparent calc(33.33% - .5px), rgba(255,255,255,.28) 0 calc(33.33% + .5px), transparent 0 calc(66.66% - .5px), rgba(255,255,255,.28) 0 calc(66.66% + .5px), transparent 0); }
.ba-h { position: absolute; top: 0; bottom: 0; left: var(--x); width: 44px; margin-left: -22px; display: flex; justify-content: center; z-index: 5; outline: none; }
.ba-h .ln { width: 1.5px; height: 100%; background: linear-gradient(180deg, rgba(217,179,106,.2), var(--gold-hi) 20%, var(--gold-hi) 80%, rgba(217,179,106,.2)); box-shadow: 0 0 12px rgba(255,214,140,.6); }
